name: 性能评分（Lighthouse）

on:
  schedule:
    # 每周一 11:00 北京时间（03:00 UTC）
    - cron: '0 3 * * 1'
  # 配置文件变更时也跑一次，便于验证配置
  push:
    paths:
      - 'lighthouserc.json'
      - 'package.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    name: 5 个代表页面性能评分
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 运行 Lighthouse
        run: |
          set +e
          npx lhci autorun > /tmp/lh.log 2>&1
          echo "退出码：$?"
          tail -n 30 /tmp/lh.log || true

      - name: 生成评分摘要
        if: always()
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            function walk(d, acc) {
              if (!fs.existsSync(d)) return acc;
              for (const f of fs.readdirSync(d)) {
                const p = path.join(d, f), st = fs.statSync(p);
                if (st.isDirectory()) walk(p, acc);
                else if (f.endsWith(".json") && f.startsWith("lhr")) acc.push(p);
              }
              return acc;
            }
            const roots = [".lighthouseci", "artifacts/lighthouse", "lighthouse-results"];
            let files = [];
            for (const r of roots) walk(r, files);

            const rows = [];
            for (const f of files) {
              let j; try { j = JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) { continue; }
              const c = j.categories || {};
              const pct = (k) => Math.round(((c[k] && c[k].score) || 0) * 100);
              const url = (j.finalUrl || j.requestedUrl || "?").replace("https://1901151458-prog.github.io/english-materials", "") || "/";
              rows.push({
                url,
                perf: pct("performance"),
                a11y: pct("accessibility"),
                bp: pct("best-practices"),
                seo: pct("seo")
              });
            }
            rows.sort((a, b) => a.url.localeCompare(b.url));

            const out = [];
            out.push("## Lighthouse 评分");
            out.push("");
            out.push("| 页面 | 性能 | 可访问性 | 最佳实践 | SEO |");
            out.push("|---|---:|---:|---:|---:|");
            for (const r of rows) {
              const mark = (v) => v >= 90 ? String(v) : v >= 50 ? v + " ⚠️" : v + " ❌";
              out.push(`| \`${r.url}\` | ${mark(r.perf)} | ${mark(r.a11y)} | ${mark(r.bp)} | ${mark(r.seo)} |`);
            }
            if (!rows.length) out.push("| （未生成报告） | - | - | - | - |");
            out.push("");
            out.push("> 90 分以上为绿色区间，50-89 为黄色，50 以下为红色。");
            console.log(out.join("\n"));

            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
            }
          '

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
            artifacts/lighthouse/
            /tmp/lh.log
          if-no-files-found: warn
          retention-days: 30

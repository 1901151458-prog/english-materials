name: 性能评分（Lighthouse）

on:
  schedule:
    # 每周一 11:00 北京时间（03:00 UTC）
    - cron: '0 3 * * 1'
  # 配置文件变更时也跑一次，便于验证配置
  push:
    paths:
      - 'lighthouserc.json'
      - 'package.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    name: 5 个代表页面性能评分
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 运行 Lighthouse
        run: |
          set +e
          npx lhci autorun > /tmp/lh.log 2>&1
          code=$?
          echo "退出码：$code"
          tail -n 80 /tmp/lh.log | while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::error title=lighthouse::$line"
            fi
          done
          exit 0

      - name: 显示报告摘要
        if: always()
        run: |
          if [ -f /tmp/lh.log ]; then
            echo "===== Lighthouse 输出尾部 ====="
            tail -n 40 /tmp/lh.log || true
          fi

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            artifacts/lighthouse/
            /tmp/lh.log
          if-no-files-found: warn
          retention-days: 30

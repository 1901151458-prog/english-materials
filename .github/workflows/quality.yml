name: 性能评分（Lighthouse）

on:
  schedule:
    # 每周一 11:00 北京时间（03:00 UTC）
    - cron: '0 3 * * 1'
  # 配置文件变更时也跑一次，便于验证配置
  push:
    paths:
      - 'lighthouserc.json'
      - 'package.json'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    name: 5 个代表页面性能评分
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 运行 Lighthouse
        run: |
          set +e
          npx lhci autorun > /tmp/lh.log 2>&1
          code=$?
          echo "退出码：$code"
          tail -n 80 /tmp/lh.log | while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::error title=lighthouse::$line"
            fi
          done
          exit 0

      - name: 显示评分
        if: always()
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            function walk(d, acc) {
              if (!fs.existsSync(d)) return acc;
              for (const f of fs.readdirSync(d)) {
                const p = path.join(d, f), st = fs.statSync(p);
                if (st.isDirectory()) walk(p, acc);
                else if (f.endsWith(".json") && f.startsWith("lhr")) acc.push(p);
              }
              return acc;
            }
            const roots = ["artifacts/lighthouse", ".lighthouseci", "lighthouse-results"];
            let files = [];
            for (const r of roots) walk(r, files);
            console.log("搜索目录：" + roots.join(" | "));
            files.slice(0, 3).forEach((f) => console.log("  样例：" + f));
            console.log("报告文件数：" + files.length);
            const rows = [];
            for (const f of files) {
              let j; try { j = JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) { continue; }
              const c = j.categories || {};
              const pct = (k) => Math.round(((c[k] && c[k].score) || 0) * 100);
              const url = (j.finalUrl || j.requestedUrl || "?").replace("https://1901151458-prog.github.io/english-materials", "") || "/";
              rows.push({ url, perf: pct("performance"), a11y: pct("accessibility"), bp: pct("best-practices"), seo: pct("seo") });
            }
            rows.sort((a, b) => a.url.localeCompare(b.url));
            console.log("页面".padEnd(30) + "性能  可访问  最佳实践  SEO");
            for (const r of rows) {
              console.log(r.url.padEnd(30) + String(r.perf).padStart(4) + String(r.a11y).padStart(7) + String(r.bp).padStart(9) + String(r.seo).padStart(6));
            }
          ' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice title=Lighthouse::$line"
          done
          echo "===== 原始输出尾部 ====="
          tail -n 20 /tmp/lh.log 2>/dev/null || true

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            artifacts/lighthouse/
            .lighthouseci/
            /tmp/lh.log
          if-no-files-found: warn
          retention-days: 30

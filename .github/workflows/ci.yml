name: 站点自检

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静态检查（结构 / 链接 / 语法 / HTML）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 结构与链接自检
        run: python scripts/check_site.py

      - name: 安装校验工具
        run: npm install --no-audit --no-fund

      - name: HTML 校验
        run: |
          set +e
          find . -name "*.html" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./artifacts/*" | sort > /tmp/hv-files.txt
          echo "待校验 HTML：$(wc -l < /tmp/hv-files.txt) 个"
          xargs npx html-validate < /tmp/hv-files.txt > /tmp/hv.log 2>&1
          code=$?
          total=$(wc -l < /tmp/hv.log)
          echo "输出行数：$total"
          head -n 45 /tmp/hv.log | while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::error title=html-validate::$line"
            fi
          done
          exit $code

      - name: 上传 HTML 校验报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-validate-report
          path: /tmp/hv.log
          if-no-files-found: ignore
          retention-days: 14
